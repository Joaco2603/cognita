<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Cognita intro</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0e0f14; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0e0f14; }
      .clip { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1920" data-height="1080">
      <div id="intro" class="clip" data-composition-id="intro" data-composition-src="compositions/intro.html"
           data-start="0" data-duration="3" data-track-index="0" data-track-kind="graphics"></div>
      <!-- Whoosh swell, trimmed so its peak lands on the glow at 0.72 s -->
      <audio id="sfx-whoosh" class="clip" src="assets/sfx/whoosh.mp3" data-start="0" data-duration="1.4"
             data-media-start="1.9" data-volume="0.55" data-fade-out="0.4" data-track-index="1"></audio>
      <!-- Impact hit when the mark lights up (CC0, AudioPapkin, freesound.org/s/649826) -->
      <audio id="sfx-hit" class="clip" src="assets/sfx/hit.mp3" data-start="0.12" data-duration="2.88"
             data-volume="0.9" data-fade-out="0.6" data-track-index="2"></audio>
      <!-- Shimmer on the light sweep -->
      <audio id="sfx-sparkle" class="clip" src="assets/sfx/sparkle.mp3" data-start="1.75" data-duration="1.25"
             data-volume="0.45" data-fade-out="0.3" data-track-index="3"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
