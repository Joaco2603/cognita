<template>
  <style>
    #root {
      position: absolute; inset: 0; overflow: hidden;
      background: #0e0f14;
      --accent: #d97757;
      --ink: #f4e9e1;
      --tile: #1e1f29;
    }
    #halo {
      position: absolute; left: 50%; top: 50%;
      width: 1400px; height: 1400px; margin: -700px 0 0 -700px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(217,119,87,0.42) 0%, rgba(217,119,87,0.12) 28%, rgba(217,119,87,0) 60%);
      opacity: 0;
    }
    #lockup {
      position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
      display: flex; align-items: center; justify-content: center; gap: 56px;
    }
    #mark { position: relative; width: 300px; height: 300px; }
    #mark svg { position: absolute; inset: 0; width: 300px; height: 300px; overflow: visible; }
    #glow { opacity: 0; }
    #word {
      font-family: Roboto, sans-serif; font-weight: 700;
      font-size: 168px; letter-spacing: -0.035em; color: var(--ink);
      line-height: 1;
    }
    #word span { display: inline-block; opacity: 0; }
    #tag {
      position: absolute; left: 0; top: 735px; width: 1920px; text-align: center;
      font-family: Roboto, sans-serif; font-weight: 700; font-size: 30px;
      letter-spacing: 0.32em; text-transform: uppercase; color: var(--accent);
      opacity: 0;
    }
    #sweep {
      position: absolute; top: 0; left: 0; width: 260px; height: 1080px;
      background: linear-gradient(90deg, rgba(255,240,230,0) 0%, rgba(255,240,230,0.16) 50%, rgba(255,240,230,0) 100%);
      opacity: 0;
    }
  </style>

  <div id="root" data-composition-id="intro" data-width="1920" data-height="1080">
  <div id="halo" data-layout-allow-overflow></div>

  <div id="lockup">
    <div id="mark">
      <!-- Glow layer: a blurred copy of the mark that flashes when it lights up -->
      <svg id="glow" viewBox="0 0 512 512">
        <defs>
          <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="18" />
          </filter>
        </defs>
        <g filter="url(#bloom)" fill="none">
          <polygon points="256,86.5 425.5,256 256,425.5 86.5,256" stroke="#ff9a72" stroke-width="34" />
          <polygon points="256,158 354,256 256,354 158,256" stroke="#ff9a72" stroke-width="22" />
          <circle cx="256" cy="256" r="32" stroke="#fff3ea" stroke-width="26" />
        </g>
      </svg>
      <!-- The Cognita mark, redrawn from assets/icon.png so each part can animate -->
      <svg id="logo" viewBox="0 0 512 512">
        <rect id="tile" x="0" y="0" width="512" height="512" rx="72" fill="#1e1f29" />
        <polygon id="outer" points="256,86.5 425.5,256 256,425.5 86.5,256" fill="none"
                 stroke="#d97757" stroke-width="29" stroke-linejoin="miter" />
        <polygon id="inner" points="256,158 354,256 256,354 158,256" fill="none"
                 stroke="#d97757" stroke-width="17" stroke-linejoin="miter" />
        <circle id="eye" cx="256" cy="256" r="32" fill="none" stroke="#f4e9e1" stroke-width="24" />
        <circle id="pupil" cx="256" cy="256" r="20" fill="#1e1f29" />
      </svg>
    </div>
    <div id="word"><span>C</span><span>o</span><span>g</span><span>n</span><span>i</span><span>t</span><span>a</span></div>
  </div>

  <div id="tag">Context for your agent</div>
  <div id="sweep"></div>
  </div>

  <script>
    (function () {
      const q = (s) => document.querySelector(s);
      const qa = (s) => document.querySelectorAll(s);

      // Perimeters of the two diamonds (4 sides each), for the draw-on.
      const outerLen = 4 * Math.hypot(169.5, 169.5);
      const innerLen = 4 * Math.hypot(98, 98);
      const eyeLen = 2 * Math.PI * 32;

      const tl = gsap.timeline({ paused: true });

      // Start state.
      tl.set(q("#outer"), { strokeDasharray: outerLen, strokeDashoffset: outerLen }, 0);
      tl.set(q("#inner"), { strokeDasharray: innerLen, strokeDashoffset: -innerLen }, 0);
      tl.set(q("#eye"), { strokeDasharray: eyeLen, strokeDashoffset: eyeLen }, 0);
      tl.set(q("#tile"), { opacity: 0 }, 0);
      tl.set(q("#pupil"), { opacity: 0 }, 0);
      tl.to(q("#pupil"), { opacity: 1, duration: 0.2 }, 0.45);
      tl.set(q("#mark"), { x: 330, scale: 0.92, transformOrigin: "50% 50%" }, 0);

      // 1. The lines draw themselves in the dark (0.05 - 0.75 s).
      tl.to(q("#outer"), { strokeDashoffset: 0, duration: 0.6, ease: "power2.inOut" }, 0.05);
      tl.to(q("#inner"), { strokeDashoffset: 0, duration: 0.5, ease: "power2.inOut" }, 0.15);
      tl.to(q("#eye"), { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, 0.4);

      // 2. The eye opens and the mark lights up (0.72 - 1.0 s).
      tl.to(q("#glow"), { opacity: 1, duration: 0.18, ease: "power2.out" }, 0.72);
      tl.to(q("#halo"), { opacity: 1, scale: 1.05, duration: 0.25, ease: "power2.out" }, 0.72);
      tl.fromTo(q("#mark"), { scale: 0.92 }, { scale: 1.04, duration: 0.2, ease: "power2.out" }, 0.72);
      tl.to(q("#mark"), { scale: 1, duration: 0.4, ease: "power3.out" }, 0.92);
      tl.to(q("#tile"), { opacity: 1, duration: 0.35, ease: "power1.out" }, 0.75);
      tl.to(q("#glow"), { opacity: 0.35, duration: 0.6, ease: "power2.out" }, 0.92);
      tl.to(q("#halo"), { opacity: 0.45, scale: 1, duration: 0.7, ease: "power2.out" }, 0.95);

      // 3. The mark slides left and the wordmark lights up letter by letter (1.0 - 1.9 s).
      tl.to(q("#mark"), { x: 0, duration: 0.6, ease: "power3.inOut" }, 1.0);
      tl.fromTo(qa("#word span"), { opacity: 0, y: 24 },
        { opacity: 1, y: 0, duration: 0.35, ease: "power3.out", stagger: 0.04 }, 1.15);
      tl.to(q("#tag"), { opacity: 1, duration: 0.4, ease: "power1.out" }, 1.5);

      // 4. A light sweep crosses the lockup, then it holds (1.75 - 3.0 s).
      tl.fromTo(q("#sweep"), { x: 420, opacity: 0 }, { x: 1300, opacity: 1, duration: 0.55, ease: "power1.inOut" }, 1.75);
      tl.to(q("#sweep"), { opacity: 0, duration: 0.15 }, 2.15);
      tl.to(q("#glow"), { opacity: 0.2, duration: 0.6 }, 1.9);

      window.__timelines = window.__timelines || {};
      window.__timelines["intro"] = tl;
    })();
  </script>
</template>
